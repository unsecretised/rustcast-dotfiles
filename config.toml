toggle_hotkey = "cmd+space"
clipboard_hotkey = "cmd+shift+c"
event_duration = 60
main_page = "blank"
start_at_login = true
window_location = "Default"
placeholder = "It's a secret"
search_url = "https://duckduckgo.com/search?q=%s"
haptic_feedback = false
cbhist = true
cbhist_paste_on_select = false
show_trayicon = true
search_dirs = []
log_path = "/tmp/rustcast.log"
debounce_delay = 300
auto_update = true
restore_input_source_on_close = true

[buffer_rules]
clear_on_hide = true
clear_on_enter = true

[theme]
text_color = [0.95, 0.95, 0.95]
background_color = [0.0, 0.0, 0.0]
secondary_bg_color = [0.1, 0.1, 0.1]
blur = false
show_icons = true
show_scroll_bar = false
font = ""
theme_mode = "dark"

[[shells]]
command = "open /Applications/Ghostty.app"
alias = "Ghostty"
alias_lc = "anscjabsjvsdja"
hotkey = "cmd+p"

[[shells]]
command = "open ~/Library/Developer/Xcode/DerivedData/sxitch-gvgkztjbeqqvkshbtsiwxyydklwv/Build/Products/Release/sxitch.app"
icon_path = "~/Documents/sxitch_icon.png"
alias = "Sxitch"
alias_lc = "sxitch dev"
hotkey = ""

[[shells]]
command = "open https://github.com"
alias = "Open GitHub"
alias_lc = "github gh !gh"

[modes]

[aliases]
ff = "firefox"
vsc = "visual"
disc = "vesktop"
