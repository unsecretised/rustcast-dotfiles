toggle_hotkey = "cmd+space"
clipboard_hotkey = "cmd+shift+c"
event_duration = 60
main_page = "blank"
start_at_login = true
placeholder = "It's a secret"
search_url = "https://duckduckgo.com/search?q=%s"
haptic_feedback = false
cbhist = true
cbhist_paste_on_select = false
show_trayicon = true
search_dirs = []
log_path = "/tmp/rustcast.log"
debounce_delay = 300
auto_update = true

[buffer_rules]
clear_on_hide = true
clear_on_enter = true

[theme]
text_color = [
    0.95,
    0.95,
    0.96,
]
background_color = [
    0.0,
    0.0,
    0.0,
]
blur = false
show_icons = true
show_scroll_bar = false
font = ""
theme_mode = "dark"

[[shells]]
command = "open https://reddit.com"
alias = "Reddit"
alias_lc = "files"
hotkey = "CTRL+SHIFT+SPACE"

[[shells]]
command = "open /Applications/Ghostty.app"
alias = "Ghostty"
alias_lc = "anscjabsjvsdja"
hotkey = "cmd+p"

[[shells]]
command = "open /Users/umangsurana/Library/Developer/Xcode/DerivedData/sxitch-gvgkztjbeqqvkshbtsiwxyydklwv/Build/Products/Release/sxitch.app"
alias = "Sxitch - finder"
alias_lc = "sxitch dev"
hotkey = ""

[modes]
work = "/Users/umangsurana/.config/rustcast/work_mode.sh"
default = "/Users/umangsurana/.config/rustcast/coding_mode.sh"

[aliases]
vsc = "visual"
ff = "firefox"
